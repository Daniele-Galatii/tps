<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Receiver (URL Params)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Pagina Receiver</h2>

        <p id="risultato"></p>

        <button onclick="tornaSender()">Torna al Sender</button>
    </div>

    <script>
        // Leggiamo i parametri dall'URL
        const params = new URLSearchParams(window.location.search);
        
        let p1 = params.get("p1") || "Non inserito";
        let p2 = params.get("p2") || "Non inserito";

        document.getElementById("risultato").innerHTML =
            "Parametro 1: <strong>" + p1 + "</strong><br>" +
            "Parametro 2: <strong>" + p2 + "</strong>";

        function tornaSender() {
            window.location.href = "sender.html";
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Sender (URL Params)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Pagina Sender</h2>

        <label>Parametro 1</label>
        <input type="text" id="param1">

        <label>Parametro 2</label>
        <input type="text" id="param2">

        <button onclick="inviaDati()"> Invia al Receiver </button>
    </div>

    <script>
        function inviaDati() {
            let p1 = document.getElementById("param1").value;
            let p2 = document.getElementById("param2").value;

            window.location.href = "receiver.html?p1=" + encodeURIComponent(p1) + "&p2=" + encodeURIComponent(p2);
        }
    </script>

</body>
</html>
