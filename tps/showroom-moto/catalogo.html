<!DOCTYPE html>
<html lang="it" data-page="catalogo">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalogo | Showroom Moto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#mainContent">Salta al contenuto</a>

  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo" aria-label="Vai alla home">
        <span class="logo-mark">🏍</span>
        <span>DG Motor Showroom</span>
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Apri menu" aria-expanded="false" aria-controls="navLinks">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav-links" id="navLinks" aria-label="Navigazione principale">
        <a href="index.html">Home</a>
        <a href="catalogo.html" class="active">Catalogo</a>
        <a href="preferiti.html" aria-label="Vai alla pagina preferiti">
          Preferiti <span id="favCount" class="count-badge">0</span>
        </a>
      </nav>

      <button id="themeBtn" class="theme-btn" aria-label="Cambia tema">◐</button>
    </div>
  </header>

  <main id="mainContent" class="catalog-page">
    <section class="catalog-hero">
      <div class="container">
        <p class="eyebrow">Catalogo interattivo</p>
        <h1>Trova la tua prossima moto</h1>
        <p class="hero-desc-small">Usa ricerca, filtri, ordinamento, dettagli e preferiti.</p>
      </div>
    </section>

    <section class="catalog-toolbar-section">
      <div class="container">
        <div class="catalog-toolbar">

          <div class="field">
            <label for="searchInput">Ricerca</label>
            <input type="text" id="searchInput" placeholder="Es. KTM, Yamaha, Ducati..." />
          </div>

          <div class="field">
            <label for="categoryFilter">Categoria</label>
            <select id="categoryFilter">
              <option value="all">Tutte</option>
              <option value="motard">Motard</option>
              <option value="sportiva">Sportiva</option>
              <option value="naked">Naked</option>
            </select>
          </div>

          <div class="field">
            <label for="sortSelect">Ordina per</label>
            <select id="sortSelect">
              <option value="default">Predefinito</option>
              <option value="name-asc">Nome A-Z</option>
              <option value="name-desc">Nome Z-A</option>
              <option value="price-asc">Prezzo crescente</option>
              <option value="price-desc">Prezzo decrescente</option>
              <option value="year-desc">Anno più recente</option>
            </select>
          </div>

          <div class="toolbar-buttons">
            <button id="resetBtn" class="btn btn-secondary" type="button">Reset</button>
          </div>

        </div>

        <div class="results-bar">
          <p id="resultsInfo">0 risultati</p>
        </div>
      </div>
    </section>

    <section class="catalog-grid-section">
      <div class="container">
        <div id="catalogGrid" class="catalog-grid" aria-live="polite"></div>
      </div>
    </section>

    <section class="form-section">
      <div class="container">
        <div class="section-head">
          <p class="eyebrow">Prenotazione demo</p>
          <h2>Richiedi un test ride</h2>
        </div>

        <form id="testRideForm" class="test-form" novalidate>

          <div class="form-grid">

            <div class="field">
              <label for="nameInput">Nome e cognome</label>
              <input type="text" id="nameInput" required aria-describedby="nameError" />
              <small class="error-message" id="nameError"></small>
            </div>

            <div class="field">
              <label for="emailInput">Email</label>
              <input type="email" id="emailInput" required aria-describedby="emailError" />
              <small class="error-message" id="emailError"></small>
            </div>

            <div class="field">
              <label for="dateInput">Data preferita</label>
              <input type="date" id="dateInput" required aria-describedby="dateError" />
              <small class="error-message" id="dateError"></small>
            </div>

            <div class="field">
              <label for="modelInput">Modello</label>
              <select id="modelInput" required aria-describedby="modelError">
                <option value="">Seleziona una moto</option>
              </select>
              <small class="error-message" id="modelError"></small>
            </div>

          </div>

          <button type="submit" class="btn btn-primary form-submit">
            Invia richiesta
          </button>

        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 DG Motor Showroom</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="modalBackdrop" class="modal-backdrop hidden"></div>
  <div id="bikeModal" class="bike-modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <button id="closeModalBtn" class="modal-close" aria-label="Chiudi dettagli">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
