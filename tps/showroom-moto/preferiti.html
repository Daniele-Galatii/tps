<!DOCTYPE html>
<html lang="it" data-page="preferiti">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preferiti | Showroom Moto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#mainContent">Salta al contenuto</a>

  <header class="site-header">
    <div class="container nav-wrap">
      <a href="index.html" class="logo" aria-label="Vai alla home">
        <span class="logo-mark">🏍</span>
        <span>DG Motor Showroom</span>
      </a>

      <button class="menu-toggle" id="menuToggle" aria-label="Apri menu" aria-expanded="false" aria-controls="navLinks">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="nav-links" id="navLinks" aria-label="Navigazione principale">
        <a href="index.html">Home</a>
        <a href="catalogo.html">Catalogo</a>
        <a href="preferiti.html" class="active">Preferiti <span id="favCount" class="count-badge">0</span></a>
      </nav>

      <button id="themeBtn" class="theme-btn" aria-label="Cambia tema">◐</button>
    </div>
  </header>

  <main id="mainContent">
    <section class="catalog-hero">
      <div class="container">
        <p class="eyebrow">Salvati localmente</p>
        <h1>Le tue moto preferite</h1>
        <p class="hero-desc-small">Qui trovi i modelli che hai aggiunto ai preferiti.</p>
      </div>
    </section>

    <section class="catalog-grid-section">
      <div class="container">
        <div class="favorites-topbar">
          <p id="favoritesInfo">0 preferiti</p>
          <button id="clearFavoritesBtn" class="btn btn-secondary" type="button">Svuota tutto</button>
        </div>

        <div id="favoritesGrid" class="catalog-grid"></div>

        <div id="emptyState" class="empty-state hidden">
          <h2>Nessun preferito salvato</h2>
          <p>Aggiungi qualche moto dal catalogo per vederla qui.</p>
          <a href="catalogo.html" class="btn btn-primary">Vai al catalogo</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© 2026 DG Motor Showroom</p>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
